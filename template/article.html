<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
    <title>{{title}} - wsh's blog</title>
    <meta name="description" content="{{description}}">
    <link rel="stylesheet" href="{{base_path}}style.css">
    <!-- highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body class="bg-cactus-bg text-cactus-text font-sans antialiased max-w-3xl mx-auto px-6 py-10 flex flex-col min-h-screen text-[15px] leading-relaxed relative">

    <!-- Header -->
    <header id="header" class="w-full mb-12 flex flex-col sm:flex-row items-center sm:items-start">
        <a href="{{base_path}}index.html" class="flex items-center flex-shrink-0 mb-4 sm:mb-0 group">
            <div class="w-[50px] h-[50px] rounded mr-5 overflow-hidden bg-cactus-code-bg">
                {{avatar}}
            </div>
            <div class="flex flex-col justify-center">
                <h1 class="text-[1.5rem] font-bold tracking-tight text-cactus-text leading-tight group-hover:opacity-80 transition-opacity">wsh's blog</h1>
            </div>
        </a>

        <!-- Nav -->
        <nav class="sm:ml-auto mt-2 sm:mt-0 flex items-center">
            <ul class="flex items-center text-sm font-light text-cactus-link">
                <li class="border-r border-cactus-link px-4 leading-none"><a href="{{base_path}}index.html" class="hover:bg-gradient-to-t hover:from-cactus-link/20 hover:to-transparent pb-1 transition-all">Home</a></li>
                <li class="pl-4 leading-none"><a href="{{base_path}}about.html" class="hover:bg-gradient-to-t hover:from-cactus-link/20 hover:to-transparent pb-1 transition-all">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Content -->
    <main class="flex-grow w-full prose prose-invert max-w-none 
        prose-headings:text-cactus-text prose-headings:font-bold prose-headings:tracking-tight
        prose-a:text-cactus-link prose-a:no-underline hover:prose-a:underline prose-a:underline-offset-4
        prose-p:text-cactus-text prose-p:font-light prose-p:leading-relaxed
        prose-code:text-cactus-code prose-code:bg-cactus-code-bg prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:before:content-none prose-code:after:content-none
        prose-pre:bg-cactus-code-bg prose-pre:border prose-pre:border-cactus-border/50 prose-pre:rounded-md prose-pre:p-4
        prose-li:text-cactus-text prose-li:font-light
        prose-blockquote:text-cactus-meta prose-blockquote:border-cactus-link prose-blockquote:font-light prose-blockquote:not-italic
        prose-hr:border-cactus-border/50
        prose-img:rounded-md">
        
        <article class="post">
            <header class="mb-10">
                <h1 class="text-3xl font-bold mb-3 text-cactus-text tracking-tight">{{title}}</h1>
                <div class="meta text-cactus-meta font-mono text-sm">
                    <time datetime="{{date}}">{{date}}</time>
                </div>
            </header>
            
            <div class="content font-light">
                {{content}}
            </div>
        </article>
    </main>

    <!-- Right floating TOC for desktop -->
    <aside class="hidden xl:block fixed top-1/2 right-8 -translate-y-1/2 w-48 max-h-[80vh] overflow-y-auto no-scrollbar border-l border-cactus-border/50 pl-4">
        <div class="text-xs font-bold text-cactus-meta mb-2 uppercase tracking-wider">Contents</div>
        <div class="text-xs text-cactus-meta space-y-2">
            {{toc}}
        </div>
    </aside>

    <!-- Footer -->
    <footer class="w-full mt-16 pt-6 pb-8 text-sm text-cactus-meta flex flex-col sm:flex-row justify-between items-center gap-4 border-t border-cactus-border/30">
        <div>Copyright &copy; 2024 wsh</div>
        <nav>
            <ul class="flex space-x-4 text-cactus-meta">
                <li><a href="{{base_path}}index.html" class="hover:text-cactus-link hover:underline underline-offset-4 decoration-cactus-link transition-colors">Home</a></li>
                <li><a href="{{base_path}}about.html" class="hover:text-cactus-link hover:underline underline-offset-4 decoration-cactus-link transition-colors">About</a></li>
            </ul>
        </nav>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fix image paths for local development if needed
            if (window.location.protocol !== 'file:') {
                const postSlug = '{{slug}}';
                document.querySelectorAll('.content img').forEach(function(img) {
                    const src = img.getAttribute('src');
                    if (src && !/^(https?:|\/\/|\/)/i.test(src)) {
                        const cleanSrc = src.replace(/^\.\//, '');
                        img.src = `/posts/${postSlug}/${cleanSrc}`;
                    }
                });
            }

            // Syntax highlighting
            document.querySelectorAll('pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });
        });
    </script>
</body>
</html>
