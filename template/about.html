        <a href="{{base_path}}index.html" class="flex items-center flex-shrink-0 mb-4 sm:mb-0 group">

        <div>Copyright &copy; 2024 wsh</div>
        <nav>

                <li><a href="{{base_path}}index.html" class="hover:text-cactus-link hover:underline underline-offset-4 decoration-cactus-link transition-colors">Home</a></li>
